# agent1_tracking/custom_tracker.yaml
# BoT-SORT tracker config, with ReID enabled at the association step itself.
tracker_type: botsort

track_high_thresh: 0.3
track_low_thresh: 0.3
new_track_thresh: 0.6
track_buffer: 300
match_thresh: 0.9
fuse_score: True
gmc_method: none

with_reid: True
model: auto
proximity_thresh: 0.2   # LOWERED from 0.5 — this gates WHEN appearance is even
                          # consulted. At 0.5, two people standing close/behind
                          # each other but not fully overlapping never triggered
                          # the appearance check, falling back to pure motion/IOU
                          # cost — exactly where a proximity swap happens.
appearance_thresh: 0.45  # RAISED from 0.35 — firmer bar now that appearance
                          # gets consulted more often, so it doesn't accept a
                          # weak/ambiguous match just because it's being asked
                          # more frequently.